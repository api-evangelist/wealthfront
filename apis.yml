  - aid: wealthfront:account-linking-api
    name: Wealthfront Account Linking API
    description: >
      External account linking and data aggregation platform that connects Wealthfront
      with third-party financial institutions via vendors such as Plaid and Finicity.
      Handles authentication on behalf of clients, ingestion of external account data,
      and computation over linked account data to power Path financial planning features
      and net worth tracking.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://support.wealthfront.com/hc/en-us/articles/115000311663-How-do-I-link-an-outside-account-to-Wealthfront
    baseURL: https://www.wealthfront.com
