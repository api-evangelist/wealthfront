aid: wealthfront
name: Wealthfront
description: >
  Wealthfront is an automated investment service offering REST APIs and integrations for
  portfolio management, financial planning, tax optimization, direct indexing, and cash
  account management. Founded in 2008 and headquartered in Palo Alto, California,
  Wealthfront manages approximately $95 billion in assets for over 1.4 million clients
  as of 2026. The platform provides automated investing with tax-loss harvesting, direct
  indexing for accounts over $100,000, high-yield cash management accounts with FDIC
  insurance up to $8 million, and stock investing with no advisory fees. Wealthfront
  went public on Nasdaq (WLTH) in December 2025.
