  - aid: wealthfront:tax-optimization-api
    name: Wealthfront Tax Optimization API
    description: >
      Automated tax optimization service providing daily tax-loss harvesting, direct
      indexing at the stock level for accounts over $100,000, and Smart Beta factor
      weighting for accounts over $500,000. The system monitors investments daily
      and automatically harvests losses to minimize tax liability while maintaining
      portfolio risk profile.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.wealthfront.com/tax-loss-harvesting
