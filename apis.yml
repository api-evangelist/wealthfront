  - aid: wealthfront:cash-account-api
    name: Wealthfront Cash Account API
    description: >
      High-yield cash management account API supporting deposits, withdrawals, transfers,
      bill pay, and debit card management. Offers 3.30% base APY with FDIC insurance
      up to $8 million through deposits swept across up to 32 program banks. Features
      instant withdrawals, wire transfers, and automated transfer scheduling.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.wealthfront.com/cash
