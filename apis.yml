  - aid: wealthfront:automated-investing-api
    name: Wealthfront Automated Investing API
    description: >
      Internal REST API powering Wealthfront's automated portfolio management service.
      Supports account creation, portfolio configuration, risk assessment, automated
      rebalancing, and tax-loss harvesting for diversified index fund portfolios.
      Consumed by Wealthfront iOS, Android, and web applications.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://www.wealthfront.com/investing
