        url: https://eng.wealthfront.com/2021/04/01/our-journey-to-a-generic-linking-platform/

  - aid: wealthfront:financial-planning-api
    name: Wealthfront Financial Planning API (Path)
    description: >
      Financial planning and retirement projection API powering Wealthfront's Path
      product. Aggregates linked external accounts, models retirement scenarios, and
      provides personalized projections for goals including home purchase, college
      savings (529 plans), and retirement. Leverages linked external account data
      to generate holistic financial plans.
